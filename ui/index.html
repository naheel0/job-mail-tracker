<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Mail Tracker</title>
<style>
  :root { color-scheme: dark;  /* native select/caret/scrollbar render dark too */
          --bg:#0f1115; --card:#171a21; --line:#262b36; --text:#e6e9ef; --dim:#8b93a5;
          --hover:#1c202a; --ring:#93c5fd; --link:#60a5fa; --slate:#374151;
          /* badge fills tuned so label text passes AA 4.5:1 */
          --applied:#2563eb; --interviewing:#9333ea; --rejected:#dc2626; --offer:#22c55e;
          --nudge:#f59e0b; --recruiter:#0369a1; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; padding:32px 24px; }
  @media (max-width:480px) { body { padding:20px 12px; } }
  ::selection { background:var(--applied); color:#fff; }
  :focus-visible { outline:2px solid var(--ring); outline-offset:2px; }
  html { scrollbar-color:var(--line) var(--bg); scrollbar-width:thin; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:var(--line); border-radius:8px; border:2px solid var(--bg); }
  ::-webkit-scrollbar-track { background:var(--bg); }
  .wrap { max-width:960px; margin:0 auto; }
  h1 { margin:0 0 4px; font-size:24px; }
  #summary { color:var(--dim); margin:0 0 20px; }
  #filters { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  button { background:var(--card); color:var(--text); border:1px solid var(--line);
           border-radius:99px; padding:6px 14px; font-size:13px; cursor:pointer; font-family:inherit; }
  button:hover:not(:disabled) { border-color:var(--dim); }
  button.on { background:var(--text); color:var(--bg); border-color:var(--text); }
  button:disabled { opacity:.35; cursor:default; }
  /* wrapper owns chrome + horizontal pan: wide tables scroll instead of breaking small screens */
  .table-wrap { overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:10px; }
  table { width:100%; min-width:600px; border-collapse:collapse; }
  th, td { text-align:left; padding:10px 14px; border-bottom:1px solid var(--line);
           font-variant-numeric:tabular-nums; overflow-wrap:break-word; }
  td.contact { overflow-wrap:anywhere; }  /* emails are the only unbroken long tokens */
  td.date { white-space:nowrap; }   /* dates and waiting days stay whole - never 2026-/10-22 */
  th { color:var(--dim); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.05em; }
  tbody tr:hover td { background:var(--hover); }   /* scan across a wide row */
  tr:last-child td { border-bottom:none; }
  a { color:var(--link); text-decoration:none; }
  a:hover { text-decoration:underline; text-underline-offset:2px; }
  .badge { font-size:12px; padding:2px 10px; border-radius:99px; color:#fff; white-space:nowrap; }
  .s-applied        { background:var(--applied); }
  .s-interviewing   { background:var(--interviewing); }
  .s-rejected       { background:var(--rejected); }
  .s-offer          { background:var(--offer); color:#052e16; }  /* dark text: white fails on green */
  .s-unclassified   { background:#4b5563; }
  .s-promo, .s-noise, .s-followup { background:var(--slate); color:#d1d5db; }
  .s-recruiter      { background:var(--recruiter); }
  .s-sent           { background:#1f2430; color:#c9d1e0; border:1px solid #3b4252; margin-right:6px; }
  .nudge { margin-left:8px; background:var(--nudge); color:#1a1200; }
  .stale { color:var(--nudge); }
  .empty { padding:24px; color:var(--dim); text-align:center; }
  /* pager */
  #pager { display:flex; align-items:center; gap:8px; flex-wrap:wrap;
           justify-content:center; margin-top:16px; color:var(--dim); font-size:13px; }
  #pager button.num { min-width:34px; padding:6px 0; }
  #range { margin-right:4px; }
  #pageSize { background:var(--card); color:var(--text); border:1px solid var(--line);
              border-radius:8px; padding:5px 8px; font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Job Mail Tracker</h1>
  <p id="summary" aria-live="polite" aria-atomic="true">loading…</p>
  <div id="filters"></div>
  <div class="table-wrap">
    <table>
      <thead><tr><th scope="col">Company</th><th scope="col">Role</th><th scope="col">Contact</th><th scope="col">Status</th><th scope="col">Last contact</th><th scope="col">Waiting</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
  <div id="empty" class="empty" role="status" hidden></div>
  <div id="pager"></div>
  <p style="color:var(--dim);font-size:13px;text-align:center;margin-top:24px">
    Processed 100% locally with open-source AI — your mail never leaves this machine.
  </p>
</div>

<script src="data.js"></script>
<script>
// ponytail: same nudge rule as services/nudge.py (>=7d + still 'applied') - keep in sync
const NUDGE_DAYS = 7;
const STATUSES = ["all", "unfiltered", "sent", "followup", "applied", "interviewing", "rejected", "offer", "promo"];
const today = new Date();

// EAGER load: data.js is one small in-memory file - lazy-loading it would only add a spinner.
// LAZY render: only the current page's rows are built into the DOM.
let DATA = window.TRACKER_DATA || [];
let MAIL = window.MAIL_DATA;           // undefined = data.js written by an older run
let filter = "all", page = 1, pageSize = 25;
const INBOX_HEAD = `<tr><th scope="col">From</th><th scope="col">Subject</th><th scope="col">Date</th><th scope="col">Label</th></tr>`;
const TRACKER_HEAD = document.querySelector("thead").innerHTML;

const days = r => {
  const d = r.last_contact ? new Date(r.last_contact) : null;
  if (!d || isNaN(d)) return null;  // unparsable date -> "-", matches Python (which skips these)
  // calendar-day diff over UTC date parts: mirrors services/nudge.py's date arithmetic
  const a = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
  const b = Date.UTC(today.getFullYear(), today.getMonth(), today.getDate());
  return Math.max(0, Math.floor((b - a) / 864e5));  // clamp: future server clock -> 0d, not -X
};
const isNudge = r =>
  (r.status === "" || r.status === "applied") && days(r) !== null && days(r) >= NUDGE_DAYS;

const isPromo = r => (r.status || "") === "promo";

const filtered = () => DATA.filter(r =>
  filter === "all" ? !isPromo(r) :   // promos hidden by default - click the promo pill to see them
  filter === "followup" ? isNudge(r) : (r.status || "") === filter);

// escape before innerHTML - subjects/company names come from email data
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function rowHTML(r) {
  const status = esc(r.status || "unclassified");
  return `<tr>
      <td>${esc(r.company) || "?"}</td>
      <td>${esc(r.role) || "-"}</td>
      <td class="contact">${r.email ? `<a href="mailto:${esc(r.email)}">${esc(r.email)}</a>` : "-"}</td>
      <td><span class="badge s-${status}">${status}</span>${
        isNudge(r) ? '<span class="badge nudge">follow up</span>' : ""}</td>
      <td class="date">${esc((r.last_contact || "").slice(0, 10)) || "-"}</td>
      <td class="${isNudge(r) ? "stale" : ""}">${days(r) === null ? "-" : days(r) + "d"}</td>
    </tr>`;
}

function renderFilters() {
  document.getElementById("filters").innerHTML = STATUSES.map(f => {
    const n = f === "unfiltered" ? (MAIL || []).length
        : f === "sent" ? (MAIL || []).filter(m => m.dir === "sent").length
        : f === "all" ? DATA.filter(r => !isPromo(r)).length : f === "followup"
        ? DATA.filter(isNudge).length : DATA.filter(r => (r.status || "") === f).length;
    return `<button data-f="${f}" class="${f === filter ? "on" : ""}" aria-pressed="${f === filter}"
                    onclick="setFilter('${f}')">${f} (${n})</button>`;
  }).join("");
}

function renderPager(total, pages) {
  if (!pages || pages <= 1) { document.getElementById("pager").innerHTML = ""; return; }
  const from = (page - 1) * pageSize + 1, to = Math.min(page * pageSize, total);
  // window of page buttons around current page - stays small no matter how many pages
  const win = [];
  for (let p = 1; p <= pages; p++)
    if (p === 1 || p === pages || Math.abs(p - page) <= 1) win.push(p);
  let nums = "", prev = 0;
  for (const p of win) {
    if (p - prev > 1) nums += "<span>…</span>";
    nums += `<button class="num ${p === page ? "on" : ""}" ${p === page ? 'aria-current="page"' : ""}
                     onclick="setPage(${p})">${p}</button>`;
    prev = p;
  }
  document.getElementById("pager").innerHTML =
    `<span id="range">${from}–${to} of ${total}</span>
     <select id="pageSize" aria-label="Rows per page" onchange="setSize(this.value)">
       ${[10, 25, 50, 100].map(n => `<option ${n === pageSize ? "selected" : ""}>${n}</option>`).join("")}
     </select>
     <button ${page === 1 ? "disabled" : ""} onclick="setPage(${page - 1})">‹ prev</button>
     ${nums}
     <button ${page === pages ? "disabled" : ""} onclick="setPage(${page + 1})">next ›</button>`;
}

function render() {
  if (filter === "unfiltered" || filter === "sent") return renderInbox();
  document.querySelector("thead").innerHTML = TRACKER_HEAD;  // undo an inbox-mode swap
  const rows = filtered();
  const pages = Math.max(1, Math.ceil(rows.length / pageSize));
  if (page > pages) page = pages;  // filter shrank the list -> clamp
  const slice = rows.slice((page - 1) * pageSize, page * pageSize);  // lazy: build only this

  document.getElementById("rows").innerHTML = slice.map(rowHTML).join("");
  const empty = document.getElementById("empty");
  empty.hidden = rows.length > 0;
  empty.textContent = DATA.length ? "Nothing matches this filter."
                                  : "No data yet - run: python main.py";
  const nudges = DATA.filter(isNudge).length;
  const promos = DATA.filter(isPromo).length;
  document.getElementById("summary").textContent =
    `${DATA.length - promos} tracked · ${nudges} need follow-up` +
    (promos ? ` · ${promos} promo (hidden by default)` : "") +
    ` · last run ${new Date().toLocaleDateString()}`;
  renderFilters();
  renderPager(rows.length, pages);
  // URL state so refresh/share keeps filter+page (cheap, no router needed)
  history.replaceState(null, "", `#${filter}/${page}`);
}

const setFilter = f => { filter = f; page = 1; render(); };
const setPage  = p => {
  page = p; render();
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  window.scrollTo({ top: 0, behavior: reduce ? "auto" : "smooth" });
};
const setSize  = n => { pageSize = +n; page = 1; render(); };

// --- unfiltered = inbox mode: every parsed mail, Gmail-style ---
const LABEL_CLASS = { interview: "interviewing", recruiter: "recruiter", noise: "noise",
                      followup: "followup", promo: "promo" };
function mailHTML(m) {
  const label = m.label || "unclassified";
  const cls = LABEL_CLASS[label] || (["applied", "rejected", "offer"].includes(label)
                                     ? label : "unclassified");
  const sent = m.dir === "sent";
  const addr = sent ? m.to : m.from;  // sent mail: the correspondent is who matters
  return `<tr>
      <td class="contact">${sent ? `<span class="badge s-sent">sent</span>` : ""}${
        addr ? `<a href="mailto:${esc(addr)}">${esc(addr)}</a>` : "-"}</td>
      <td>${esc(m.subject) || "-"}</td>
      <td class="date">${esc((m.date || "").slice(0, 10)) || "-"}</td>
      <td><span class="badge s-${cls}">${esc(label)}</span></td>
    </tr>`;
}

function renderInbox() {
  document.querySelector("thead").innerHTML = INBOX_HEAD;
  const all = MAIL || [];
  const mails = filter === "sent" ? all.filter(m => m.dir === "sent") : all;
  const pages = Math.max(1, Math.ceil(mails.length / pageSize));
  if (page > pages) page = pages;
  const slice = mails.slice((page - 1) * pageSize, page * pageSize);  // lazy: only this page
  document.getElementById("rows").innerHTML = slice.map(mailHTML).join("");
  const empty = document.getElementById("empty");
  empty.hidden = mails.length > 0;
  empty.textContent = !MAIL ? "Mail list missing - run: python main.py to regenerate data.js"
                       : filter === "sent" ? "No sent mail found."
                       : "No mail yet - run: python main.py";
  const sentN = all.filter(m => m.dir === "sent").length;
  const view = filter === "sent" ? "sent mail only" : "unfiltered view (everything)";
  document.getElementById("summary").textContent =
    `${mails.length} mails${filter === "sent" ? "" : ` (${sentN} sent)`} · ` +
    `${mails.filter(m => !m.label).length} not yet classified · ` +
    `${view} · last run ${new Date().toLocaleDateString()}`;
  renderFilters();   // pills must track the active view (inbox modes return early from render())
  renderPager(mails.length, pages);
  history.replaceState(null, "", `#${filter}/${page}`);
}

// restore from URL: #applied/2
(() => {
  const [f, p] = location.hash.slice(1).split("/");
  if (f && STATUSES.includes(f)) filter = f;
  if (+p > 0) page = +p;
  render();
})();
</script>
</body>
</html>
